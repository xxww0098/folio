name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test src/lib/hono/app.test.ts
      - run: node --experimental-strip-types --test src/lib/release.test.ts src/lib/blog/wikilink.test.ts src/lib/blog/wiki-suggest.test.ts src/lib/blog/video-embed.test.ts src/lib/theme/catalog.test.ts src/lib/theme/layout.test.ts src/lib/mcp/handler.test.ts src/lib/entrance/core.test.ts src/lib/pages/visibility.test.ts src/lib/topics/catalog.test.ts src/lib/updates/core.test.ts src/lib/seo.test.ts src/lib/attachments/mime.test.ts src/lib/attachments/refs.test.ts src/lib/obsidian/token-guard.test.ts
      - run: node --test scripts/ensure-entrance.test.mjs
